---
### Standalone playbook to install VS Code extensions.
### Run with: ansible-playbook -i localhost, ~/.config/ansible/vscode.yml
### Regenerate the list with: code --list-extensions | sort
###
### All tasks run as the invoking user (no sudo): extensions install
### into ~/.vscode/extensions. Idempotent — re-runs only install
### extensions that are missing (case-insensitive comparison).

- name: Install VS Code extensions
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    ansible_python_interpreter: /usr/bin/python3

    vscode_extensions:
      # AI & editor enhancements
      - anthropic.claude-code
      - carlomaragno.sleighighlight
      - jkiviluoto.tws
      - johnpapa.vscode-peacock

      # Markdown
      - davidanson.vscode-markdownlint

      # Git
      - eamodio.gitlens

      # Python
      - ms-python.debugpy
      - ms-python.python
      - ms-python.vscode-pylance
      - ms-python.vscode-python-envs

      # C/C++ & build
      - ms-vscode.cmake-tools
      - ms-vscode.cpp-devtools
      - ms-vscode.cpptools
      - ms-vscode.cpptools-extension-pack
      - ms-vscode.cpptools-themes
      - ms-vscode.makefile-tools

      # Java
      - redhat.java
      - vscjava.vscode-gradle
      - vscjava.vscode-java-debug
      - vscjava.vscode-java-dependency
      - vscjava.vscode-java-pack
      - vscjava.vscode-java-test
      - vscjava.vscode-maven

      # Containers & remote development
      - ms-azuretools.vscode-containers
      - ms-vscode-remote.remote-containers
      - ms-vscode-remote.remote-ssh
      - ms-vscode-remote.remote-ssh-edit
      - ms-vscode.remote-explorer

  tasks:
    - name: Verify code CLI is available
      ansible.builtin.command: code --version
      changed_when: false

    - name: Get installed VS Code extensions
      ansible.builtin.command: code --list-extensions
      register: vscode_installed
      changed_when: false

    - name: Install VS Code extensions
      ansible.builtin.command: "code --install-extension {{ item }}"
      loop: "{{ vscode_extensions }}"
      when: item | lower not in (vscode_installed.stdout_lines | map('lower') | list)
      register: vscode_install
      changed_when: "'successfully installed' in (vscode_install.stdout | default('') | lower)"
