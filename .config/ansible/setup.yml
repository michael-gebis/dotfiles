---
### Generic Ubuntu workstation setup (tracked by yadm)
### Org-specific tasks go in local.yml (not tracked)
- name: Setup Ubuntu workstation
  hosts: localhost
  connection: local
  become: true
  become_flags: '-n -H'

  vars:
    ansible_python_interpreter: /usr/bin/python3
    ubuntu_release: "{{ ansible_facts['distribution_release'] }}"
    user_home: "{{ lookup('env', 'HOME') }}"

    apt_packages:
      # Terminal & shell
      - fonts-powerline
      - ghostty
      - mc
      - tmux

      # Editors & diff
      - meld
      - vim

      # Version control
      - git
      - gitk
      - yadm

      # Search & navigation
      - cscope
      - fd-find
      - ripgrep
      - silversearcher-ag
      - universal-ctags

      # Languages & build tools
      - build-essential
      - clang
      - clang-format
      - cloc
      - golang-go
      - indent
      - maven
      - meson
      - npm
      - python3-pip
      - python3-venv
      - python-is-python3
      - shellcheck

      # Dev libraries (VS Code native extension builds)
      - libfontconfig-dev
      - libsecret-1-dev
      - libx11-dev
      - libxkbfile-dev

      # Docker
      - containerd.io
      - docker-buildx-plugin
      - docker-ce
      - docker-ce-cli
      - docker-compose-plugin

      # Desktop apps
      - code
      - flameshot
      - gnome-tweaks
      - google-chrome-stable
      - inkscape
      - okular
      - typora
      - wireshark

      # Networking
      - bmon
      - net-tools
      - openssh-server
      - socat
      - sshfs
      - tailscale

      # Compression & archive
      - lz4
      - lziprecover
      - lzop
      - p7zip-full
      - unar
      - zstd

      # Utilities
      - btop
      - ca-certificates
      # provides kvm-ok (KVM/virtualization readiness check)
      - cpu-checker
      - curl
      - glow
      - gnupg
      - graphviz
      - htop
      - landscape-common
      - librsvg2-bin
      - ncdu
      - nvme-cli
      - pandoc
      - pdfgrep
      - poppler-utils
      - qpdf
      - restic
      # texlive: TeX engine + fonts so pandoc can render PDFs
      - texlive-fonts-extra
      - texlive-fonts-recommended
      - texlive-latex-recommended
      - texlive-luatex
      - texlive-xetex
      # gstreamer/ffmpeg media codecs for desktop playback
      - ubuntu-restricted-addons
      - wget

    snap_packages:
      - pdftk
      - drawio                      # draw.io desktop - headless SVG export (command-flow.drawio)

    npm_packages:
      - "@mermaid-js/mermaid-cli"   # mmdc - Mermaid flow / sequence / state diagrams
      - wavedrom-cli                # WaveDrom - register bit-fields + signal timing
      - bytefield-svg               # bytefield-svg - multi-row byte-record diagrams

  tasks:
    ### -------------------------------------------------------
    ### Third-party APT repositories
    ### -------------------------------------------------------

    - name: Ensure apt keyrings directory exists
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    # === apt source cleanup — MUST run before the first apt operation below ===
    # A leftover repo file that conflicts with one we manage (e.g. a ghostty repo whose
    # Signed-By differs from ours) makes apt refuse to read ANY source, so the first
    # "apt update" — including the implicit one in the python3-debian task — fails outright.
    # Cleaning these up first is what unbreaks apt, so it has to precede that task.

    # On machines first provisioned with the old apt_repository tasks, the *.list files
    # they wrote still linger beside the new *.sources and would duplicate (or, if the
    # key path differs, fatally conflict with) them. Remove the ones we now own.
    - name: Remove legacy .list repo files superseded by deb822 .sources
      ansible.builtin.file:
        path: "/etc/apt/sources.list.d/{{ item }}.list"
        state: absent
      loop:
        - docker
        - tailscale
        - typora
        - ghostty
        - vscode
        - google-chrome
        - charm

    # ghostty was historically added via `add-apt-repository ppa:mkasberg/ghostty-ubuntu`,
    # which writes mkasberg-ubuntu-ghostty-ubuntu-<suite>.sources with the signing key INLINED.
    # Our own ghostty.sources declares the same repo with Signed-By: /etc/apt/keyrings/ghostty.asc,
    # so apt sees two different Signed-By values for one source and refuses to read the list.
    # Drop the add-apt-repository copy (the glob covers any release codename) so only ours remains.
    - name: Find stray add-apt-repository ghostty .sources (any suite)
      ansible.builtin.find:
        paths: /etc/apt/sources.list.d
        patterns: "mkasberg-ubuntu-ghostty-ubuntu-*.sources"
      register: stray_ghostty_sources

    - name: Remove stray add-apt-repository ghostty .sources
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ stray_ghostty_sources.files }}"
      loop_control:
        label: "{{ item.path }}"

    # Third-party repos are written as deb822 .sources via deb822_repository, which
    # updates each file in place rather than appending the way apt_repository did — so
    # changing a key or URL can't leave a stale, conflicting line behind. The module
    # fetches each signing key itself (signed_by: <url>), needs python3-debian, and does
    # NOT refresh the apt cache (handled by the "Update apt cache" task below).
    - name: Ensure python3-debian is present (required by deb822_repository)
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true

    - name: Add Docker repository
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ubuntu_release }}"
        components: stable
        architectures: amd64
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Add Tailscale repository
      ansible.builtin.deb822_repository:
        name: tailscale
        types: deb
        uris: https://pkgs.tailscale.com/stable/ubuntu
        suites: "{{ ubuntu_release }}"
        components: main
        signed_by: "https://pkgs.tailscale.com/stable/ubuntu/{{ ubuntu_release }}.noarmor.gpg"

    # Flat repo: the suite is a path ending in "/", so components are omitted.
    - name: Add Typora repository
      ansible.builtin.deb822_repository:
        name: typora
        types: deb
        uris: https://downloads.typora.io/linux
        suites: "./"
        signed_by: https://typora.io/linux/public-key.asc

    - name: Add Ghostty PPA repository
      ansible.builtin.deb822_repository:
        name: ghostty
        types: deb
        uris: https://ppa.launchpadcontent.net/mkasberg/ghostty-ubuntu/ubuntu
        suites: "{{ ubuntu_release }}"
        components: main
        signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x0721FDF5FECB88DC6920361657C8EF455CEAE491"

    # name: vscode writes the same vscode.sources the `code` package manages, so the two
    # stay a single declaratively-managed file rather than conflicting copies.
    - name: Add VS Code repository
      ansible.builtin.deb822_repository:
        name: vscode
        types: deb
        uris: https://packages.microsoft.com/repos/code
        suites: stable
        components: main
        architectures: amd64
        signed_by: https://packages.microsoft.com/keys/microsoft.asc

    # Likewise, name: google-chrome matches the file the chrome package self-configures.
    - name: Add Google Chrome repository
      ansible.builtin.deb822_repository:
        name: google-chrome
        types: deb
        uris: https://dl.google.com/linux/chrome/deb/
        suites: stable
        components: main
        architectures: amd64
        signed_by: https://dl.google.com/linux/linux_signing_key.pub

    # Charm serves a flat repo addressed with literal wildcards (suite "*", component
    # "*"); that is intentional, not a placeholder.
    - name: Add Charm repository
      ansible.builtin.deb822_repository:
        name: charm
        types: deb
        uris: https://repo.charm.sh/apt/
        suites: "*"
        components: "*"
        signed_by: https://repo.charm.sh/apt/gpg.key

    ### -------------------------------------------------------
    ### Package installation
    ### -------------------------------------------------------

    # No cache_valid_time here: deb822_repository does not refresh the cache itself, and
    # on a fresh machine the bootstrap ran "apt update" only minutes ago — a valid-time
    # guard could skip this and leave the new third-party repos unfetched before install.
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install apt packages
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present

    # fd-find (in apt_packages above) installs the binary as `fdfind` on Debian/Ubuntu:
    # the `fd` name collides with an unrelated package, so Debian renamed it. Symlink the
    # conventional `fd` name into /usr/local/bin so both scripts and interactive shells
    # can call `fd` (an alias would only cover interactive shells). /usr/local/bin is
    # always on PATH ahead of /usr/bin and keeps the link beside the system package it
    # targets -- ~/.local/bin is reserved for the hand-fetched release binaries below.
    - name: Symlink fd -> fdfind (Ubuntu names the fd-find binary 'fdfind')
      ansible.builtin.file:
        src: /usr/bin/fdfind
        dest: /usr/local/bin/fd
        state: link
        force: true

    - name: Install snap packages
      community.general.snap:
        name: "{{ item }}"
        state: present
      loop: "{{ snap_packages }}"

    # mmdc moved from a snap to a system-global npm install. Removal is a no-op on a
    # fresh machine and migrates any machine still carrying the old snap (mirrors the
    # "Remove legacy .list repo files" cleanup above). The npm installs run as root
    # (play default become: true), landing in /usr/local/lib/node_modules.
    - name: Remove mermaid-cli snap (replaced by the npm global install below)
      community.general.snap:
        name: mermaid-cli
        state: absent

    # Node >=17 defaults to "verbatim" DNS order and tries the AAAA (IPv6) address first.
    # On a host whose IPv6 is advertised-but-dead, npm then hangs to ETIMEDOUT instead of
    # falling back to IPv4 (curl/git avoid this via Happy Eyeballs; npm does not). ipv4first
    # prefers IPv4 and is a no-op where IPv6 genuinely works -> safe on every machine.
    - name: Install global npm packages (diagram renderers)
      community.general.npm:
        name: "{{ item }}"
        global: true
        state: present
      loop: "{{ npm_packages }}"
      environment:
        NODE_OPTIONS: "--dns-result-order=ipv4first"

    # Obsidian publishes official .deb/AppImage builds but no apt repo, and the
    # .deb does NOT self-update (it sat on 1.9.14 for months while 1.12.x shipped).
    # So look up the newest release on GitHub and install that .deb — but only when
    # the installed version differs, else every run re-downloads the ~100 MB file.
    - name: Look up the latest Obsidian release
      ansible.builtin.uri:
        url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
        return_content: true
      register: obsidian_release
      failed_when: false        # offline / rate-limited -> install task below just skips

    - name: Get the installed Obsidian version (empty string if absent)
      ansible.builtin.command: dpkg-query -W -f='${Version}' obsidian
      register: obsidian_installed
      changed_when: false
      failed_when: false

    - name: Install/upgrade Obsidian from the latest official .deb
      ansible.builtin.apt:
        deb: "{{ (obsidian_release.content | from_json).assets | selectattr('name', 'search', '_amd64\\.deb$') | map(attribute='browser_download_url') | first }}"
      when:
        - obsidian_release.status | default(0) == 200
        - (obsidian_release.content | from_json).tag_name | regex_replace('^v', '') != obsidian_installed.stdout

    ### -------------------------------------------------------
    ### User-level tools (no sudo)
    ### -------------------------------------------------------

    - name: Install powerline-go
      become: false
      ansible.builtin.shell: |
        go install github.com/justjanne/powerline-go@latest
      args:
        creates: "{{ user_home }}/go/bin/powerline-go"
      environment:
        GOPATH: "{{ user_home }}/go"
        PATH: "/usr/local/go/bin:/usr/bin:/bin"

    - name: Install atuin
      become: false
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -LsSf https://setup.atuin.sh | sh
      args:
        creates: "{{ user_home }}/.atuin/bin/atuin"

    - name: Install uv
      become: false
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -LsSf https://astral.sh/uv/install.sh | sh
      args:
        creates: "{{ user_home }}/.local/bin/uv"

    # rustup: official Rust toolchain manager (apt's rustc/cargo are far too old
    # for current projects). --no-modify-path because .bashrc already prepends
    # ~/.cargo/bin (top of file), so rustup must NOT append its own duplicate PATH
    # line to the tracked shell rc. Installs stable once; refresh with `rustup update`.
    - name: Install rustup + stable Rust toolchain
      become: false
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --profile default
      args:
        creates: "{{ user_home }}/.cargo/bin/rustup"
      environment:
        RUSTUP_HOME: "{{ user_home }}/.rustup"
        CARGO_HOME: "{{ user_home }}/.cargo"

    - name: Install nvm
      become: false
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -o- https://raw.githubusercontent.com/nvm-sh/nvm/HEAD/install.sh | bash
      args:
        creates: "{{ user_home }}/.nvm/nvm.sh"

    - name: Install SDKMAN
      become: false
      ansible.builtin.shell: |
        curl --proto '=https' --tlsv1.2 -s "https://get.sdkman.io" | bash
      args:
        creates: "{{ user_home }}/.sdkman/bin/sdkman-init.sh"

    # d2 ships as a single static binary; its installer drops it in ~/.local/bin.
    - name: Install d2 (diagram renderer)
      become: false
      ansible.builtin.shell: |
        curl -fsSL https://d2lang.com/install.sh | sh -s -- --prefix "{{ user_home }}/.local"
      args:
        creates: "{{ user_home }}/.local/bin/d2"

    # pikchr has no apt/snap/npm package, so build the upstream C binary into ~/.local/bin.
    # report/diagrams/render.sh calls "pikchr-cli FILE > out.svg" with no flags, but the C
    # pikchr needs --svg-only to emit SVG to stdout -> install a thin pikchr-cli wrapper too.
    # (Needs a C toolchain; build-essential is in apt_packages above.)
    - name: Build and install pikchr (C) into ~/.local/bin
      become: false
      ansible.builtin.shell: |
        set -e
        src="$(mktemp -d)"
        git clone --depth 1 https://github.com/drhsqlite/pikchr "$src"
        make -C "$src" pikchr
        install -m 0755 "$src/pikchr" "{{ user_home }}/.local/bin/pikchr"
        rm -rf "$src"
      args:
        creates: "{{ user_home }}/.local/bin/pikchr"

    - name: Install pikchr-cli wrapper (adds --svg-only for render.sh)
      become: false
      ansible.builtin.copy:
        dest: "{{ user_home }}/.local/bin/pikchr-cli"
        mode: "0755"
        content: |
          #!/bin/sh
          exec pikchr --svg-only "$@"

    # lazydocker is a Docker TUI. `go install ...@latest` currently fails to build
    # (it pulls Docker SDK v28, which dropped registry.ServiceConfig), so install the
    # prebuilt release binary into ~/.local/bin instead — same idea as Obsidian above:
    # look up the newest release and unpack it only when the installed version differs.
    - name: Look up the latest lazydocker release
      become: false
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazydocker/releases/latest
        return_content: true
      register: lazydocker_release
      failed_when: false

    - name: Get the installed lazydocker version (empty string if absent)
      become: false
      ansible.builtin.command: "{{ user_home }}/.local/bin/lazydocker --version"
      register: lazydocker_installed
      changed_when: false
      failed_when: false

    - name: Install/upgrade lazydocker from the latest release tarball
      become: false
      ansible.builtin.unarchive:
        src: "{{ (lazydocker_release.content | from_json).assets | selectattr('name', 'search', 'Linux_x86_64\\.tar\\.gz$') | map(attribute='browser_download_url') | first }}"
        dest: "{{ user_home }}/.local/bin"
        include:
          - lazydocker
        remote_src: true
      when:
        - lazydocker_release.status | default(0) == 200
        - ((lazydocker_release.content | from_json).tag_name | regex_replace('^v', '')) not in lazydocker_installed.stdout

    # fzf (fuzzy finder). The apt build trails upstream and lacks newer events
    # (e.g. the start:reload the rgf helper in .bashrc relies on), so install the
    # latest release binary into ~/.local/bin -- same fetch-when-newer pattern as above.
    - name: Look up the latest fzf release
      become: false
      ansible.builtin.uri:
        url: https://api.github.com/repos/junegunn/fzf/releases/latest
        return_content: true
      register: fzf_release
      failed_when: false

    - name: Get the installed fzf version (empty string if absent)
      become: false
      ansible.builtin.command: "{{ user_home }}/.local/bin/fzf --version"
      register: fzf_installed
      changed_when: false
      failed_when: false

    - name: Install/upgrade fzf from the latest release tarball
      become: false
      ansible.builtin.unarchive:
        src: "{{ (fzf_release.content | from_json).assets | selectattr('name', 'search', 'linux_amd64\\.tar\\.gz$') | map(attribute='browser_download_url') | first }}"
        dest: "{{ user_home }}/.local/bin"
        include:
          - fzf
        remote_src: true
      when:
        - fzf_release.status | default(0) == 200
        - ((fzf_release.content | from_json).tag_name | regex_replace('^v', '')) not in fzf_installed.stdout

    # lazygit (git TUI), same fetch-when-newer release-binary pattern as above.
    # NB: lazygit names its asset linux_x86_64 (lowercase) -- unlike lazydocker's
    # Linux_x86_64 -- so match case-insensitively with (?i).
    - name: Look up the latest lazygit release
      become: false
      ansible.builtin.uri:
        url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
        return_content: true
      register: lazygit_release
      failed_when: false

    - name: Get the installed lazygit version (empty string if absent)
      become: false
      ansible.builtin.command: "{{ user_home }}/.local/bin/lazygit --version"
      register: lazygit_installed
      changed_when: false
      failed_when: false

    - name: Install/upgrade lazygit from the latest release tarball
      become: false
      ansible.builtin.unarchive:
        src: "{{ (lazygit_release.content | from_json).assets | selectattr('name', 'search', '(?i)linux_x86_64\\.tar\\.gz$') | map(attribute='browser_download_url') | first }}"
        dest: "{{ user_home }}/.local/bin"
        include:
          - lazygit
        remote_src: true
      when:
        - lazygit_release.status | default(0) == 200
        - ((lazygit_release.content | from_json).tag_name | regex_replace('^v', '')) not in lazygit_installed.stdout

    # GNOME dock pins live in dconf (binary, not yadm-friendly), so enforce a denylist
    # instead: unpin-apps strips unwanted .desktop IDs from org.gnome.shell favorite-apps.
    # It is subtractive (keeps every other pin) and no-ops where gsettings/GNOME is absent
    # (WSL, headless), so it is safe on every machine. become: false so it edits the user's
    # dconf via the user's DBus session, not root's.
    - name: Unpin unwanted apps from the GNOME dock
      become: false
      ansible.builtin.command: "{{ user_home }}/.local/bin/unpin-apps"
      register: unpin_result
      changed_when: "'unpinned:' in unpin_result.stdout"
      failed_when: false

    ### -------------------------------------------------------
    ### Tor Browser (official tarball -- no apt repo/snap exists)
    ### -------------------------------------------------------

    # Ubuntu 24.04+ denies unprivileged user namespaces to unconfined binaries
    # (kernel.apparmor_restrict_unprivileged_userns=1), which crashes the sandbox
    # of any browser installed outside apt/snap at launch. This stub profile
    # exists solely to grant userns to the tarball install -- flags=(unconfined)
    # imposes no other confinement, the same pattern as the stub profiles Ubuntu
    # ships in /etc/apparmor.d for chrome/opera. Skipped where AppArmor is
    # absent (WSL), where the restriction doesn't apply either.
    - name: Install AppArmor userns profile for Tor Browser
      ansible.builtin.copy:
        dest: /etc/apparmor.d/tor-browser
        mode: "0644"
        content: |
          abi <abi/4.0>,
          include <tunables/global>

          profile tor-browser @{HOME}/.local/share/tor-browser/Browser/firefox.real flags=(unconfined) {
            userns,

            include if exists <local/tor-browser>
          }
      register: torbrowser_apparmor
      when: ansible_facts.apparmor.status | default('disabled') == 'enabled'

    - name: Load the Tor Browser AppArmor profile
      ansible.builtin.command: apparmor_parser -r /etc/apparmor.d/tor-browser
      when: torbrowser_apparmor is changed

    # The Tor Project ships the browser only as a tarball: deb.torproject.org
    # carries just the tor daemon (the browser bundles its own tor), and apt's
    # torbrowser-launcher breaks whenever Tor rotates signing keys. The tarball
    # self-updates in place once installed somewhere user-writable, so this is
    # an install-once creates: task like atuin/uv above -- NOT the
    # version-guarded re-fetch used for fzf/lazygit. downloads.json is Tor's own
    # update channel (update_3); keys verified 2026-07:
    # .downloads["linux-x86_64"].ALL.binary (the .asc signature URL sits
    # alongside as .sig, if GPG verification is ever wanted).
    - name: Look up the current Tor Browser release
      become: false
      ansible.builtin.uri:
        url: https://aus1.torproject.org/torbrowser/update_3/release/downloads.json
        return_content: true
      register: torbrowser_release
      failed_when: false        # offline -> install task below just skips

    - name: Install Tor Browser into ~/.local/share (self-updates thereafter)
      become: false
      ansible.builtin.unarchive:
        src: "{{ (torbrowser_release.content | from_json).downloads['linux-x86_64'].ALL.binary }}"
        dest: "{{ user_home }}/.local/share"
        remote_src: true
        creates: "{{ user_home }}/.local/share/tor-browser"
      when: torbrowser_release.status | default(0) == 200

    # start-tor-browser.desktop is a self-modifying polyglot script whose
    # shebang is a RELATIVE path (#!/usr/bin/env ./Browser/execdesktop), so it
    # runs only with the install dir as cwd (env: 'No such file or directory',
    # rc 127, otherwise) -- hence chdir, mirroring the documented
    # "cd tor-browser && ./start-tor-browser.desktop --register-app" usage.
    - name: Register the Tor Browser desktop entry
      become: false
      ansible.builtin.command: ./start-tor-browser.desktop --register-app
      args:
        chdir: "{{ user_home }}/.local/share/tor-browser"
        creates: "{{ user_home }}/.local/share/applications/start-tor-browser.desktop"

    ### -------------------------------------------------------
    ### Local/org-specific tasks (if present)
    ### -------------------------------------------------------

    - name: Check for local tasks
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/local.yml"
      register: local_tasks_file

    - name: Include local tasks
      ansible.builtin.include_tasks: local.yml
      when: local_tasks_file.stat.exists
